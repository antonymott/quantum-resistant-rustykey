# Build + Sigstore-backed provenance attestation (GitHub Artifact Attestations).
#
# WHAT THIS PROVES: that *this* GitHub Actions workflow, at this repo + commit,
#   produced the exact npm tarball whose sha256 is recorded in the attestation.
#   Downstream users can run:  gh attestation verify <file.tgz> --repo antonymott/quantum-resistant-rustykey
#
# WHAT THIS DOES NOT PROVE: that the compiled WASM matches the C source, and it is
#   NOT a reproducible build. Provenance != source-to-binary equivalence. See the
#   notes at the bottom of this file and the message that accompanied it.
#
# This workflow does NOT publish to npm and needs NO NPM token. It is safe to run.
name: Attest build provenance

on:
  workflow_dispatch: {}        # manual runs — the only way to actually test OIDC/attestation
  release:
    types: [published]

permissions:
  contents: read               # least privilege by default

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC token for keyless Sigstore signing
      attestations: write       # write the attestation to the repo's attestation store
    env:
      REQUIRE_WASM_BUILD: '1'  # <-- make a skipped/stale WASM build FAIL, so the attestation is meaningful
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.32.1'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.4.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Real build: compiles C -> WASM via the pinned emscripten/emsdk:3.1.51 Docker
      # image used by scripts/build-wasm.mjs, then bundles + tsdown. REQUIRE_WASM_BUILD=1
      # makes this fail rather than silently reuse committed prebuilt WASM.
      - name: Build (C -> WASM -> dist)
        run: pnpm build

      - name: Verify dist artifacts
        run: pnpm verify:dist

      - name: Pack the exact npm tarball
        id: pack
        run: |
          FILE=$(npm pack --silent)
          echo "tarball=$FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE"

      # Sigstore-backed provenance for the tarball users actually install.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}

# ----------------------------------------------------------------------------
# NOTES / KNOWN GAPS (read before relying on this for a "reproducible build" claim):
#
# 1. NOT reproducible yet. scripts/build-wasm.mjs clones vendored crypto sources
#    with `git clone --depth 1` from moving branches (mlkem-native, mldsa-native,
#    the-sqisign). Two runs can pull different commits. For real reproducibility,
#    pin each vendor repo to a specific commit SHA.
#
# 2. Emscripten output is not bit-for-bit deterministic by default (embedded paths,
#    tool versions). -g4 / source maps do NOT fix this; they produce a *different,
#    larger, debug* binary than what you ship, so do not add them here.
#
# 3. npm --provenance is intentionally NOT enabled: releases are published manually
#    from a maintainer machine due to npm 2FA. npm provenance requires publishing
#    *from* trusted CI with OIDC, so it is not available in this flow.
#
# 4. IMPORTANT for manual publish: for the attestation to cover what users actually
#    install, the maintainer must publish THIS workflow's tarball, not a laptop
#    rebuild (a laptop rebuild has a different sha256 and `gh attestation verify`
#    would fail). Flow:
#       - run this workflow -> download the `npm-tarball` artifact
#       - on the maintainer machine:  npm publish ./quantum-resistant-rustykey-<v>.tgz
#    Then verify:
#       gh attestation verify $(npm pack quantum-resistant-rustykey@<v> 2>/dev/null) \
#         --repo antonymott/quantum-resistant-rustykey
#
# 5. Best practice for the score: pin these actions to commit SHAs (not floating
#    major tags) once you've confirmed the versions you want.
# ----------------------------------------------------------------------------
