# Reproducible C→WASM build + Sigstore provenance attestation.
#
# PROVES (Option B): pinned vendor C trees + pinned Emscripten rebuild to the
#   same src/vendor/*.js hashes (pnpm verify:repro). Audit artifacts add public
#   source maps / assertions for opacity analyzers.
# PROVES (Option A): GitHub Artifact Attestations on the npm tarball
#   (gh attestation verify …). Does NOT alone prove WASM↔C.
#
# Does NOT publish to npm (2FA). Download npm-tarball and:
#   npm publish ./quantum-resistant-rustykey-<v>.tgz
name: Attest build provenance

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      REQUIRE_REPRODUCIBLE: "1"
      REQUIRE_WASM_BUILD: "1"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned vendor C trees
        run: pnpm fetch:vendors

      - name: Build (reproducible C → WASM → dist)
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee build.log

      - name: Verify dist artifacts
        run: pnpm verify:dist

      - name: Verify reproducible WASM hashes
        run: pnpm verify:repro

      - name: Build audit WASM (source maps + assertions)
        run: |
          set -euo pipefail
          pnpm build:audit 2>&1 | tee -a build.log

      - name: Upload build log
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log

      - name: Upload audit WASM + source maps
        uses: actions/upload-artifact@v7
        with:
          name: wasm-audit-sourcemaps
          path: wasm/audit-build/

      - name: Pack gzip npm tarball (.tgz)
        id: pack
        run: |
          set -euo pipefail
          RAW=$(npm pack --ignore-scripts --silent | tail -n1)
          test -n "$RAW" && test -f "$RAW"
          echo "Packed: $RAW ($(du -h "$RAW" | cut -f1))"
          if file -b "$RAW" | grep -qi 'gzip compressed'; then
            FILE="$RAW"
          else
            BASE="${RAW%.tar}"
            BASE="${BASE%.tgz}"
            FILE="${BASE}.tgz"
            gzip -c -9 "$RAW" > "$FILE"
            rm -f "$RAW"
            echo "Re-gzipped to: $FILE ($(du -h "$FILE" | cut -f1))"
          fi
          file -b "$FILE"
          test -f "$FILE"
          echo "tarball=$FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
