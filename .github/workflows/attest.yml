# Build + Sigstore-backed provenance attestation (GitHub Artifact Attestations).
#
# WHAT THIS PROVES: that *this* GitHub Actions workflow, at this repo + commit,
#   produced the exact npm tarball whose sha256 is recorded in the attestation.
#   Downstream users can run:  gh attestation verify <file.tgz> --repo antonymott/quantum-resistant-rustykey
#
# WHAT THIS DOES NOT PROVE: that the compiled WASM matches the C source, and it is
#   NOT a reproducible build. Provenance != source-to-binary equivalence. See the
#   notes at the bottom of this file and the message that accompanied it.
#
# This workflow does NOT publish to npm and needs NO NPM token. It is safe to run.
#
# Tooling versions come from package.json:
#   - packageManager → pnpm version (pnpm/action-setup)
#   - engines.node   → Node version (actions/setup-node)
name: Attest build provenance

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      REQUIRE_WASM_BUILD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (C -> WASM -> dist)
        run: pnpm build

      - name: Verify dist artifacts
        run: pnpm verify:dist

      # npm pack emits a .tgz (gzip). npm reject plain .tar (ERR_INVALID_CONTENT_TYPE / 415).
      # Re-gzip if needed and attest/upload only the npm-compatible file.
      - name: Pack gzip npm tarball (.tgz)
        id: pack
        run: |
          set -euo pipefail
          RAW=$(npm pack --ignore-scripts --silent | tail -n1)
          test -n "$RAW" && test -f "$RAW"
          echo "Packed: $RAW ($(du -h "$RAW" | cut -f1))"
          if file -b "$RAW" | grep -qi 'gzip compressed'; then
            FILE="$RAW"
          else
            # Plain tar (or unexpected type) → gzip to .tgz for the registry
            BASE="${RAW%.tar}"
            BASE="${BASE%.tgz}"
            FILE="${BASE}.tgz"
            gzip -c -9 "$RAW" > "$FILE"
            rm -f "$RAW"
            echo "Re-gzipped to: $FILE ($(du -h "$FILE" | cut -f1))"
          fi
          file -b "$FILE"
          test -f "$FILE"
          echo "tarball=$FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}

# ----------------------------------------------------------------------------
# NOTES / KNOWN GAPS:
#
# 1. NOT reproducible yet — vendor clones use moving default branches.
# 2. For attestation to cover what users install, publish THIS workflow's .tgz
#    (download the npm-tarball artifact), not a laptop rebuild:
#       npm publish ./quantum-resistant-rustykey-<v>.tgz
# 3. Prefer pinning actions to commit SHAs once versions are confirmed.
# ----------------------------------------------------------------------------
